<!DOCTYPE html>
<html>
<head>
    <title>Seatwork2</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<style>
    * {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background-image: url("https://images.squarespace-cdn.com/content/v1/664c7ae50eea9c731b37e817/158c4532-1ab3-4ce5-8ed4-f59ce7e847d2/O.B.+Montessori+Center+Greenhills+Campus");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}


nav {
    background-color: #212529;
    color: white;
    height: 40px;
    display: flex;
    align-items: center;
    padding: 10px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 12px;
    margin-left: 15px;
}

.logo {
    font-size: 15px;
}

.search {
    margin-left: auto;
}

.search input {
    padding: 6px;
    border-radius: 4px;
    border: 1px solid gray;
}

.search button {
    background-color: #0d6efd;
    color: white;
    border: none;
    padding: 7px;
    border-radius: 4px;
}


.container {
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding: 30px;
}


.office {
    width: 45%;
}

.office h2 {
    background-color: white;
    text-align: center;
    font-size: 20px;
    font-weight: normal;
    padding: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
    font-size: 12px;
}

th {
    background-color: #c9dcf8;
    padding: 10px;
}

td {
    text-align: center;
    padding: 8px;
    border: 1px solid #ddd;
}


.contact {
    background-color: white;
    width: 25%;
    padding: 15px;
    border-radius: 5px;
}

.contact h2 {
    text-align: center;
    font-weight: normal;
}

form label {
    display: block;
    font-size: 12px;
    margin-top: 10px;
}

form input,
form textarea {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
    border: 1px solid #ddd;
    border-radius: 4px;
}

textarea {
    height: 80px;
}

form button {
    width: 100%;
    background-color: #0d6efd;
    color: white;
    border: none;
    padding: 10px;
    margin-top: 10px;
    border-radius: 4px;
}
</style>
 
    <nav>
        <div class="logo">🌐</div>
        <a href="#">Contact Us</a>

        <div class="search">
            <input type="text" placeholder="Search">
            <button>Search</button>
        </div>
    </nav>


    <div class="container">

       
        <div class="office">
            <h2>School Office Hours</h2>

            <table>
                <tr>
                    <th>Day</th>
                    <th>Office Hours</th>
                    <th>Department</th>
                </tr>

                <tr>
                    <td>Monday</td>
                    <td>8:00 AM – 4:00 PM</td>
                    <td>Registrar's Office</td>
                </tr>

                <tr>
                    <td>Tuesday</td>
                    <td>8:00 AM – 4:00 PM</td>
                    <td>Accounting Office</td>
                </tr>

                <tr>
                    <td>Wednesday</td>
                    <td>8:00 AM – 4:00 PM</td>
                    <td>Guidance Office</td>
                </tr>

                <tr>
                    <td>Thursday</td>
                    <td>8:00 AM – 4:00 PM</td>
                    <td>Principal's Office</td>
                </tr>

                <tr>
                    <td>Friday</td>
                    <td>8:00 AM – 3:00 PM</td>
                    <td>Admin Office</td>
                </tr>
            </table>
        </div>

       
        <div class="contact">
            <h2>Contact Us</h2>

            <form>
                <label>Full Name</label>
                <input type="text" placeholder="Enter your full name">

                <label>Email Address</label>
                <input type="email" placeholder="Enter your email">

                <label>Subject</label>
                <input type="text" placeholder="Enter subject">

                <label>Message</label>
                <textarea placeholder="Type your message here"></textarea>

                <button type="submit">Send Message</button>
            </form>
        </div>

    </div>

</body>
</html>
